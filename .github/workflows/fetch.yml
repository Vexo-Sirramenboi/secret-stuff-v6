name: Fetch EaglercraftX 1.8.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Crawl launcher and download resources
        env:
          GAME_URL: https://ecz-launcher.vercel.app/games/EaglercraftX%201.8.8/
        run: |
          cat > fetch-game.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          const GAME_URL = process.env.GAME_URL;
          const OUTPUT = path.resolve("game");

          fs.rmSync(OUTPUT, { recursive: true, force: true });
          fs.mkdirSync(OUTPUT, { recursive: true });

          function getFilePath(urlString) {
            const url = new URL(urlString);

            let pathname = decodeURIComponent(url.pathname);

            if (!pathname || pathname.endsWith("/")) {
              pathname += "index.html";
            }

            pathname = pathname.replace(/^\/+/, "");

            // Prevent anything from escaping the game directory.
            pathname = pathname.replace(/\.\./g, "");

            return path.join(OUTPUT, pathname);
          }

          async function saveResponse(response) {
            try {
              const request = response.request();
              const resourceType = request.resourceType();

              if (![
                "document",
                "script",
                "stylesheet",
                "image",
                "font",
                "media",
                "manifest",
                "xhr",
                "fetch",
                "other"
              ].includes(resourceType)) {
                return;
              }

              const url = response.url();

              if (
                url.startsWith("data:") ||
                url.startsWith("blob:") ||
                url.startsWith("ws:") ||
                url.startsWith("wss:")
              ) {
                return;
              }

              const filePath = getFilePath(url);
              fs.mkdirSync(path.dirname(filePath), { recursive: true });

              const body = await response.body();

              if (!fs.existsSync(filePath)) {
                fs.writeFileSync(filePath, body);
                console.log(
                  "Downloaded:",
                  url,
                  "->",
                  path.relative(OUTPUT, filePath)
                );
              }
            } catch (error) {
              console.log("Could not save:", response.url(), error.message);
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            page.on("response", async response => {
              await saveResponse(response);
            });

            page.on("requestfailed", request => {
              console.log(
                "Request failed:",
                request.url(),
                request.failure()?.errorText || ""
              );
            });

            console.log("Opening:");
            console.log(GAME_URL);

            await page.goto(GAME_URL, {
              waitUntil: "networkidle",
              timeout: 120000
            });

            console.log("Launcher loaded.");

            // Give Eaglercraft additional time to request
            // assets, language files, and other resources.
            await page.waitForTimeout(30000);

            console.log("Finished waiting for resources.");

            await browser.close();
          })();
          EOF

          node fetch-game.js

      - name: Show downloaded game
        run: |
          echo "Downloaded files:"
          find game -type f -print | sort

          echo
          echo "File sizes:"
          du -ah game | sort -h | tail -30

      - name: Replace repository root files
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -R game/. deploy/

          echo
          echo "Deployment contents:"
          find deploy -type f -print | sort

      - name: Copy game into repository
        run: |
          cp -R deploy/. .

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fetch EaglercraftX 1.8.8 and required resources"
          git push
