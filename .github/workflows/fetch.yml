name: Fetch EaglercraftX 1.8.8
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download game
        run: |
          curl -L --fail -o index.html "https://ecz-launcher.vercel.app/games/EaglercraftX%201.8.8/"
          ls -l index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add EaglercraftX 1.8.8 as index.html"
          git push
